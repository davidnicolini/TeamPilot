spring:
  application:
    name: teampilot

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/teampilot}
    username: ${SPRING_DATASOURCE_USERNAME:teampilot}
    password: ${SPRING_DATASOURCE_PASSWORD:teampilot}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

  docker:
    compose:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-por-uma-chave-forte-de-pelo-menos-32-bytes}
    expiration-ms: 86400000