services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: teampilot
      POSTGRES_USER: teampilot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-teampilot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teampilot -d teampilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/teampilot
      SPRING_DATASOURCE_USERNAME: teampilot
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-teampilot}
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-por-uma-chave-forte-de-pelo-menos-32-bytes}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
